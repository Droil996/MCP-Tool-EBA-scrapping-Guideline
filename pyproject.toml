[project]
name = "eba-mcp-simple"
version = "0.1.0"
description = "Simple MCP server for EBA regulatory impact classification"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "uvicorn>=0.30.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pypdf>=6.11.0",
]

[project.scripts]
eba-mcp-simple = "eba_mcp_simple.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
